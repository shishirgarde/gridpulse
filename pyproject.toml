[project]
name = "gridpulse"
version = "1.0.0"
description = "Seven-day daily electricity demand forecasting for Delhi: Chronos-2 LoRA + TCN ensemble, served on Modal."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Shishir Garde" }]
requires-python = ">=3.11,<3.13"
keywords = ["time-series", "forecasting", "electricity", "chronos", "tcn", "modal", "india"]

# Core: the authenticated API client and the dashboard server.
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Local inference with the committed model weights (src/gridpulse/inference.py).
inference = [
    "numpy>=1.26",
    "pandas>=2.2",
    "torch>=2.6",
    "chronos-forecasting==2.3.2",
    "transformers>=5.0",
    "peft>=0.22",
    "accelerate",
    "safetensors",
]
# Everything the research notebooks use.
research = [
    "gridpulse[inference]",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "scipy",
    "xgboost",
    "lightgbm",
    "timesfm[torch]",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "huggingface-hub>=0.26",
    "datasets>=3.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
# Deploying the Modal apps in deploy/.
deploy = ["modal[api-proxy-support]>=1.6.4"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
